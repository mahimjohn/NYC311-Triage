project:
          name: "NYC 311 Service Request Triage and Resolution-Time Prediction System"
          version: "1.0.0"
          environment: "development"

data_sources:
          dataset_name: "311 Service Requests from 2020 to Present"
          dataset_id: "erm2-nwe9"
          source_url: "https://data.cityofnewyork.us/Social-Services/311-Service-Requests-from-2020-to-Present/erm2-nwe9"
          api_url: "https://data.cityofnewyork.us/resource/erm2-nwe9.json"

ingestion:
          start_date: "2025-01-01T00:00:00"
          end_date: "2026-01-01T00:00:00"
          page_size: 50000
          max_rows: 100000
          request_timeout: 30
          retry_count: 3
          retry_delay: 5

data:
          required_columns:
            - unique_key
            - created_date
            - agency
            - agency_name
            - complaint_type
            - descriptor
            - location_type
            - incident_zip
            - borough
            - city
            - latitude
            - longitude
            - closed_date
                          
          prediction_time_columns: 
            - unique_key
            - created_date
            - agency
            - agency_name
            - complaint_type
            - descriptor
            - location_type
            - incident_zip
            - borough
            - city
            - latitude
            - longitude
          target_column: "closed_date"
          identifier_columns: 
            - unique_key

target:
          column: closed_date
          type: binary
          threshold_days: 7
          positive_class: 1
          negative_class: 0

paths:
          data:
              raw: "data/raw"
              processed: "data/processed"
              snapshots: "data/snapshots"

          models:
              artifacts: "models/artifacts"

          logs: "logs"

          sql: "sql"

database:
          host:
          port:
          database_name:
          schema:

model:
          name:
          version:
          algorithm:
          artifact_path:
          random_state:

prediction:
          threshold:
          fallback_enabled:
          fallback_strategy: "level_0_majority_class"

logging:
          level: "INFO"
          file: "application.log"

application:
          api:
            host: "0.0.0.0"
            port: 8000

          streamlit:
            port: 8501

